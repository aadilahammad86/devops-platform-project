# .github/workflows/deploy.yml

name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t api ./api
          docker build -t worker ./worker

      - name: Deploy (local simulation for now)
        run: |
          docker compose down
          docker compose up -d --build