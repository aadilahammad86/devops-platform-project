name: CI Pipeline

on:
  push:
    branches: [ develop, master, feature/recovery-scaling ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (API)
        run: |
          cd api
          npm install

      - name: Run Tests (API)
        run: |
          cd api
          npm test

      - name: Install Dependencies (Worker)
        run: |
          cd worker
          npm install

      - name: Run Tests (Worker)
        run: |
          cd worker
          npm test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (API)
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

      - name: Build and Push (Worker)
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:latest
      
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/recovery-scaling'
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Check if project exists, if not clone it
            if [ ! -d "~/devops-platform-project" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/devops-platform-project
            fi
            
            cd ~/devops-platform-project
            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            # Login to registry on the VM
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Update the stack
            docker compose pull
            docker compose up -d