# docker-compose.yml

services:

  api:
    # build: ./api
    image: ghcr.io/aadilahammad86/devops-platform-project/api:latest
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Pass123}
      DB_NAME: ${DB_NAME:-appdb}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PORT: ${API_PORT:-5000}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

    # enable vscode debugging
    #   ports:
    #     - "9229:9229"
    #   command: ["node", "--inspect=0.0.0.0:9229", "src/index.js"]
    # debug via chrome using "chrome://inspect"

  worker:
    # build: ./worker
    image: ghcr.io/aadilahammad86/devops-platform-project/worker:latest
    env_file:
      - .env
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Pass123}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped