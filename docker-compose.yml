# docker-compose.yml

services:

  api:
    build: ./api
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

    # enable vscode debugging
    #   ports:
    #     - "9229:9229"
    #   command: ["node", "--inspect=0.0.0.0:9229", "src/index.js"]
    # debug via chrome using "chrome://inspect"

  worker:
    build: ./worker
    env_file:
      - ./worker/.env
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped