# docker-compose.yml

services:

  api:
    build: ./api
    env_file:
      - ./api/.env
    depends_on:
      - postgres
      - redis

  worker:
    build: ./worker
    env_file:
      - ./worker/.env
    depends_on:
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: Pass123
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api